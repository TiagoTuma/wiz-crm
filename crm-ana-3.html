<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wiz CRM — Ana</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --bg:#F6F7F9; --panel:#FFFFFF; --ink:#1B1B2F; --ink2:#5C6270; --muted:#8A90A0; --faint:#BCC0CC;
    --border:#EAEBF0; --border-2:#DDDFE8; --hover:#F4F5F8;
    --pri:#F7941D; --pri-ink:#D97C06; --pri-soft:#FCE3C2; --pri-soft2:#FEF6EC;
    --wiz:#F7941D;
    --s1:#5E97D6; --s2:#9B7AD1; --s3:#E9A23A; --s4:#E8703C; --s5:#42B07C; --side:#9AA3AD;
    --green:#27AE60; --red:#E14B5A; --amber:#E9A23A;
    --shadow:0 1px 3px rgba(27,27,47,.07); --shadow-md:0 6px 22px rgba(27,27,47,.12); --shadow-lg:0 18px 50px rgba(27,27,47,.22);
    --sb:218px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,sans-serif;font-size:14px;-webkit-font-smoothing:antialiased}
  button{font-family:inherit;cursor:pointer}
  ::selection{background:var(--pri-soft)}

  /* sidebar */
  .sidebar{position:fixed;top:0;left:0;width:var(--sb);height:100%;background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;z-index:30}
  .sb-brand{display:flex;align-items:center;gap:10px;padding:18px 18px 16px;border-bottom:1px solid var(--border)}
  .sb-brand img{height:26px;width:auto}
  .sb-brand .t{font-weight:800;font-size:17px;letter-spacing:-.01em}
  .sb-brand .t small{color:var(--pri);font-weight:700}
  .nav{padding:12px 10px;flex:1}
  .nav button{display:flex;align-items:center;gap:11px;width:100%;border:0;background:transparent;padding:10px 12px;border-radius:9px;font-size:14px;font-weight:600;color:var(--ink2);margin-bottom:3px;text-align:left}
  .nav button:hover{background:var(--hover)}
  .nav button.on{background:var(--pri-soft);color:var(--pri-ink)}
  .nav button svg{width:18px;height:18px;flex-shrink:0}
  .nav button .badge{margin-left:auto;background:var(--red);color:#fff;font-size:11px;font-weight:700;border-radius:20px;padding:1px 7px;min-width:18px;text-align:center}
  .nav button.on .badge{background:var(--pri)}
  .sb-foot{padding:12px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:7px}
  .sb-foot .btn{justify-content:center;font-size:12.5px;padding:8px}
  .sb-mini{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:2px}
  .sb-mini button{border:0;background:none;color:var(--muted);font-size:11px;cursor:pointer;padding:2px}
  .sb-mini button:hover{color:var(--pri-ink);text-decoration:underline}
  .sb-mini span{color:var(--faint);font-size:10px}

  .main{margin-left:var(--sb);min-height:100vh}
  .topbar{position:sticky;top:0;background:rgba(246,247,249,.85);backdrop-filter:blur(8px);z-index:20;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 26px;border-bottom:1px solid var(--border)}
  .topbar h1{font-size:20px;font-weight:800;margin:0;letter-spacing:-.02em}
  .topbar .right{display:flex;gap:10px;align-items:center}
  .search{position:relative}
  .search input{border:1px solid var(--border-2);background:var(--panel);border-radius:9px;padding:9px 12px 9px 34px;font-size:13.5px;width:260px;color:var(--ink);outline:none}
  .search input:focus{border-color:var(--pri);box-shadow:0 0 0 3px var(--pri-soft)}
  .search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted)}
  .btn{border:1px solid var(--border-2);background:var(--panel);color:var(--ink);border-radius:9px;padding:9px 14px;font-size:13.5px;font-weight:600;display:inline-flex;align-items:center;gap:6px;transition:.12s}
  .btn:hover{background:var(--hover)}
  .btn.primary{background:var(--pri);border-color:var(--pri);color:#fff}
  .btn.primary:hover{background:var(--pri-ink);border-color:var(--pri-ink)}
  .btn.sm{padding:6px 11px;font-size:12.5px}
  .content{padding:22px 26px 80px}

  /* KPI */
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
  .kpi{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px 18px;box-shadow:var(--shadow)}
  .kpi .lbl{color:var(--ink2);font-size:13px;font-weight:600;display:flex;align-items:center;gap:7px}
  .kpi .num{font-weight:800;font-size:28px;letter-spacing:-.02em;margin-top:6px;line-height:1}
  .kpi .sub{font-size:12px;color:var(--muted);margin-top:4px}
  .kpi.red .num{color:var(--red)} .kpi.amber .num{color:var(--amber)} .kpi.green .num{color:var(--green)}

  .panel{background:var(--panel);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);margin-bottom:20px;overflow:hidden}
  .panel-h{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--border)}
  .panel-h h2{font-size:15px;font-weight:700;margin:0}
  .panel-h .lnk{font-size:13px;color:var(--pri);font-weight:600;background:none;border:0}

  /* mini pipeline */
  /* clientes agrupado (monday-like) */
  .cli-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap}
  .cli-left{display:flex;align-items:center;gap:8px}
  .cli-right{display:flex;align-items:center;gap:14px}
  .cli-total{font-size:13.5px;color:var(--ink2)}.cli-total b{color:var(--ink);font-weight:700}
  .cli-lbl{font-size:13px;color:var(--ink2);font-weight:600}
  .gbt{border:1px solid var(--border-2);background:var(--panel);border-radius:8px;padding:7px 13px;font-size:13px;font-weight:600;color:var(--ink2)}
  .gbt:hover{background:var(--hover)}
  .gbt.on{background:var(--pri);border-color:var(--pri);color:#fff}
  .mtbl{padding:0;overflow:visible;background:transparent;border:0;box-shadow:none}
  .mgrp{background:var(--panel);border:1px solid var(--border);border-left:5px solid var(--gc,#ccc);border-radius:12px;box-shadow:var(--shadow);margin-bottom:16px;overflow:hidden}
  .mgrp-h{display:flex;align-items:center;gap:10px;padding:15px 18px;cursor:pointer;user-select:none;background:#FBFBFD;background:color-mix(in srgb,var(--gc,#ccc) 9%,#fff)}
  .mgrp-h:hover{background:color-mix(in srgb,var(--gc,#ccc) 15%,#fff)}
  .mgrp-h .arw{font-size:11px;color:var(--ink2);transition:transform .15s}
  .mgrp-h.collapsed .arw{transform:rotate(-90deg)}
  .mgrp-h .gname{font-weight:800;font-size:16.5px;letter-spacing:-.01em;color:var(--ink)}
  .mgrp-h .gcount{background:var(--gc,#999);color:#fff;border-radius:20px;padding:3px 12px;font-size:12px;font-weight:700;white-space:nowrap}
  .mgrp-h .gs{margin-left:auto;font-size:13px;color:var(--ink2);font-weight:700}
  .mh,.mrow{display:grid;grid-template-columns:1.7fr 1fr 1fr 1.1fr 96px 130px 140px;gap:0}
  .mh{background:#fff;border-top:1px solid var(--border);border-bottom:1px solid var(--border);font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:700}
  .mh>div{padding:9px 14px;border-right:1px solid var(--border)}
  .mh>div:last-child{border-right:0}
  .mrow{border-bottom:1px solid var(--border);cursor:pointer;transition:.08s}
  .mrow:hover{background:var(--pri-soft2)}
  .mrow .mc{padding:13px 14px;border-right:1px solid var(--border);display:flex;align-items:center;font-size:14px;overflow:hidden;min-height:48px}
  .mrow .mc:last-child{border-right:0}
  .mrow .cn{font-weight:600}
  .mrow .dim{color:var(--ink2)}
  .naoaloc{color:var(--amber);font-weight:600;font-size:12.5px;font-style:italic}
  .add-row{padding:11px 16px;color:var(--ink2);font-size:13.5px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:7px;background:#FCFCFE}
  .add-row:hover{color:var(--pri);background:var(--pri-soft2)}
  .add-row .plus{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:5px;background:var(--pri-soft);color:var(--pri-ink);font-weight:800}
  .add-input-row{display:flex;gap:8px;padding:11px 16px;background:var(--pri-soft2);align-items:center}
  .add-input{flex:1;border:1px solid var(--pri);border-radius:8px;padding:9px 12px;font-size:14px;outline:none;box-shadow:0 0 0 3px var(--pri-soft)}
  .gedit{margin-left:12px;border:1px solid var(--border-2);background:#fff;color:var(--ink2);border-radius:7px;padding:4px 9px;font-size:11.5px;font-weight:600;cursor:pointer}
  .gedit:hover{background:var(--pri-soft2);color:var(--pri-ink);border-color:var(--pri)}
  .stage-edit{padding:14px 16px;background:var(--pri-soft2);border-bottom:1px solid var(--border);display:flex;flex-direction:column;gap:11px}
  .se-name{border:1px solid var(--pri);border-radius:8px;padding:9px 12px;font-size:14px;font-weight:600;outline:none;box-shadow:0 0 0 3px var(--pri-soft)}
  .se-colors{display:flex;gap:8px;flex-wrap:wrap}
  .se-sw{width:26px;height:26px;border-radius:7px;cursor:pointer;border:2px solid transparent;transition:.1s}
  .se-sw:hover{transform:scale(1.1)}
  .se-sw.on{border-color:var(--ink);box-shadow:0 0 0 2px #fff inset}
  .se-actions{display:flex;gap:8px;align-items:center}
  .stage-add{background:#fff;border:2px dashed var(--border-2);border-radius:12px;justify-content:center;color:var(--pri-ink);font-weight:700;padding:14px;box-shadow:var(--shadow)}
  .stage-add:hover{background:var(--pri-soft2);border-color:var(--pri)}
  .stage-edit.new{border:1px solid var(--pri-soft);border-radius:12px;box-shadow:var(--shadow);margin-bottom:16px}
  @media(max-width:960px){.mh,.mrow{grid-template-columns:1.4fr 1fr 90px 130px}.mh>div:nth-child(n+5),.mrow .mc:nth-child(n+5){display:none}.mh>div:nth-child(3),.mrow .mc:nth-child(3){display:none}}
  .resumo2{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px}
  .rklist{padding:14px 18px}
  .rk{margin-bottom:13px}.rk:last-child{margin-bottom:0}
  .rk-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:5px}
  .rk-name{font-weight:600;font-size:13.5px}
  .rk-val{font-size:13px;font-weight:700} .rk-val small{color:var(--muted);font-weight:500;font-size:11.5px}
  .rk-bar{height:7px;background:var(--hover);border-radius:6px;overflow:hidden}
  .rk-bar span{display:block;height:100%;border-radius:6px}
  .gdotin{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:7px;vertical-align:0}
  .rk-total{margin-top:14px;padding-top:13px;border-top:1px solid var(--border);font-size:13.5px;color:var(--ink2);text-align:right}
  .rk-total b{color:var(--ink)}
  @media(max-width:860px){.resumo2{grid-template-columns:1fr}}
  .minipipe{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;padding:16px 18px}
  .mp{border:1px solid var(--border);border-radius:10px;padding:11px 12px;cursor:pointer;transition:.12s}
  .mp:hover{background:var(--hover)}
  .mp .l{font-size:12px;color:var(--ink2);font-weight:600;display:flex;align-items:center;gap:6px}
  .mp .l .dot{width:9px;height:9px;border-radius:3px}
  .mp .n{font-size:22px;font-weight:800;margin-top:4px;line-height:1}
  .mp .v{font-size:11px;color:var(--muted);margin-top:2px}

  /* table */
  .filterbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .chip{border:1px solid var(--border-2);background:var(--panel);border-radius:30px;padding:7px 14px;font-size:13px;font-weight:600;color:var(--ink2);display:inline-flex;gap:7px;align-items:center}
  .chip:hover{background:var(--hover)}
  .chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .chip .dot{width:8px;height:8px;border-radius:50%}
  .chip .ct{opacity:.7}
  .tbl{width:100%;border-collapse:collapse;background:var(--panel)}
  .tbl thead th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:700;padding:11px 16px;border-bottom:1px solid var(--border);background:#FBFBFD}
  .tbl tbody td{padding:12px 16px;border-bottom:1px solid var(--border);font-size:13.5px;vertical-align:middle}
  .tbl tbody tr{cursor:pointer;transition:.08s}
  .tbl tbody tr:hover{background:var(--hover)}
  .tbl tbody tr:last-child td{border-bottom:0}
  td .cn{font-weight:600}
  .num-c{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
  .stchip{display:inline-block;font-size:11.5px;font-weight:700;color:#fff;border-radius:20px;padding:3px 11px;white-space:nowrap}
  .av{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--ink2)}
  .av .ball{width:25px;height:25px;border-radius:50%;color:#fff;font-weight:700;font-size:11px;display:grid;place-items:center;flex-shrink:0}
  .dash{color:var(--faint)}
  .nexttask{font-size:12.5px;display:inline-flex;align-items:center;gap:6px}
  .nexttask .tdot{width:7px;height:7px;border-radius:50%}
  .empty{padding:48px;text-align:center;color:var(--muted)}

  /* tasks list */
  .tgroup{margin-bottom:8px}
  .tgroup .gh{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--ink2);padding:14px 18px 8px;display:flex;align-items:center;gap:8px}
  .tgroup .gh .c{color:var(--muted);font-weight:600}
  .gh.over{color:var(--red)}
  .trow{display:flex;align-items:center;gap:12px;padding:11px 18px;border-bottom:1px solid var(--border);background:var(--panel)}
  .trow:hover{background:var(--hover)}
  .tcheck{width:20px;height:20px;border:2px solid var(--border-2);border-radius:6px;flex-shrink:0;display:grid;place-items:center;cursor:pointer;background:#fff}
  .tcheck:hover{border-color:var(--pri)}
  .tcheck.done{background:var(--green);border-color:var(--green);color:#fff}
  .ttitle{font-weight:600;font-size:14px}
  .ttitle.done{text-decoration:line-through;color:var(--muted)}
  .tmeta{font-size:12px;color:var(--muted);display:flex;gap:10px;margin-top:2px;flex-wrap:wrap}
  .ttype{font-size:11px;font-weight:700;color:#fff;border-radius:20px;padding:2px 9px}
  .tclient{color:var(--pri);font-weight:600;cursor:pointer}
  .tdue{font-size:12.5px;color:var(--ink2);font-weight:600;margin-left:auto;white-space:nowrap}
  .tdue.over{color:var(--red)}
  .tdel{border:0;background:transparent;color:var(--faint);font-size:13px}
  .tdel:hover{color:var(--red)}

  /* drawer */
  .scrim{position:fixed;inset:0;background:rgba(27,27,47,.4);opacity:0;pointer-events:none;transition:.18s;z-index:40}
  .scrim.open{opacity:1;pointer-events:auto}
  .drawer{position:fixed;top:0;right:0;height:100%;width:500px;max-width:96vw;background:var(--bg);box-shadow:var(--shadow-lg);transform:translateX(100%);transition:transform .22s cubic-bezier(.4,0,.2,1);z-index:41;display:flex;flex-direction:column}
  .drawer.open{transform:none}
  #drawerContent{display:flex;flex-direction:column;height:100%;min-height:0;width:100%}
  .dr-head{padding:18px 22px 0;background:var(--panel);border-bottom:1px solid var(--border);position:relative}
  .dr-head .x{position:absolute;top:16px;right:18px;border:0;background:transparent;font-size:23px;color:var(--ink2);line-height:1}
  .dr-head h2{font-size:20px;font-weight:800;margin:0 34px 8px 0;letter-spacing:-.01em}
  .dr-head .sub{display:flex;gap:10px;align-items:center;margin-bottom:12px;font-size:13px;color:var(--ink2)}
  .dr-tabs{display:flex;gap:4px}
  .dr-tabs button{border:0;background:transparent;padding:10px 14px;font-size:13.5px;font-weight:600;color:var(--ink2);position:relative}
  .dr-tabs button.on{color:var(--pri)}
  .dr-tabs button.on::after{content:"";position:absolute;left:8px;right:8px;bottom:-1px;height:2.5px;background:var(--pri);border-radius:3px}
  .dr-tabs .tb{background:var(--pri-soft);color:var(--pri-ink);border-radius:20px;font-size:10.5px;padding:0 6px;margin-left:5px;font-weight:700}
  .dr-body{padding:18px 22px 60px;overflow-y:auto;flex:1;min-height:0}
  .block{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:14px}
  .block h4{margin:0 0 12px;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700}
  .field{margin-bottom:12px}.field:last-child{margin-bottom:0}
  .field label{display:block;font-size:12px;color:var(--ink2);font-weight:600;margin-bottom:5px}
  .field input,.field textarea,.field select{width:100%;border:1px solid var(--border-2);border-radius:8px;padding:9px 11px;font-size:13.5px;font-family:inherit;color:var(--ink);outline:none;background:#fff}
  .field input:focus,.field textarea:focus,.field select:focus{border-color:var(--pri);box-shadow:0 0 0 3px var(--pri-soft)}
  .field textarea{resize:vertical;min-height:64px;line-height:1.5}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .stagebtns{display:flex;flex-wrap:wrap;gap:6px}
  .stagebtns button{border:1px solid var(--border-2);background:#fff;border-radius:7px;padding:6px 11px;font-size:12.5px;font-weight:600;color:var(--ink2)}
  .stagebtns button.on{color:#fff;border-color:transparent}
  .bubble-list{display:flex;flex-direction:column;gap:10px;margin-top:12px}
  .bubble{background:var(--pri-soft2);border:1px solid var(--pri-soft);border-radius:12px 12px 12px 4px;padding:11px 13px;font-size:13.5px;line-height:1.55}
  .bubble .meta{font-size:11px;color:var(--muted);margin-top:7px;display:flex;justify-content:space-between}
  .bubble .del{border:0;background:none;color:var(--faint);font-size:11px}.bubble .del:hover{color:var(--red)}
  /* task inside client */
  .tklist{display:flex;flex-direction:column;gap:8px;margin-top:12px}
  .tkitem{display:flex;align-items:flex-start;gap:10px;padding:10px;border:1px solid var(--border);border-radius:10px;background:#fff}
  .tkitem .tcheck{width:19px;height:19px}
  .tkitem .ti{flex:1}
  .tkitem .tt{font-weight:600;font-size:13.5px}
  .tkitem .tt.done{text-decoration:line-through;color:var(--muted)}
  .tkitem .tm{font-size:11.5px;color:var(--muted);margin-top:2px;display:flex;gap:8px;align-items:center}

  /* modal */
  .modal{position:fixed;inset:0;display:none;place-items:center;background:rgba(27,27,47,.42);z-index:50;padding:20px}
  .modal.open{display:grid}
  .modal .box{background:var(--panel);border-radius:14px;width:500px;max-width:100%;max-height:92vh;overflow-y:auto;box-shadow:var(--shadow-lg);padding:22px}
  .modal h3{font-weight:800;margin:0 0 4px;font-size:18px}
  .modal .msub{color:var(--muted);font-size:12.5px;margin:0 0 16px}
  .modal .actions{display:flex;justify-content:flex-end;gap:8px;margin-top:6px}
  .toast{position:fixed;bottom:24px;left:calc(50% + var(--sb)/2);transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:11px 20px;border-radius:30px;font-size:13.5px;font-weight:600;opacity:0;transition:.2s;z-index:60;box-shadow:var(--shadow-lg)}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  @media(max-width:860px){
    :root{--sb:0px}
    .sidebar{position:fixed;bottom:0;top:auto;left:0;width:100%;height:auto;flex-direction:row;border-right:0;border-top:1px solid var(--border)}
    .sb-brand,.sb-foot{display:none}
    .nav{display:flex;padding:6px;justify-content:space-around;flex:1}
    .nav button{flex-direction:column;gap:3px;font-size:10px;padding:7px 4px}
    .nav button .badge{margin:0;position:absolute}
    .main{margin-left:0;padding-bottom:70px}
    .kpis{grid-template-columns:repeat(2,1fr)}
    .search input{width:150px}
    .toast{left:50%}
  }
</style>
</head>

let state=load(),nav='inicio',filter='all';

function load(){try{const r=localStorage.getItem(KEY);if(r){const d=JSON.parse(r);if(d&&d.deals){if(!d.stages||!d.stages.length)d.stages=DEFAULT_STAGES.map(s=>({...s}));const rl=d.stages.find(s=>s.k==='relacionamento');if(rl&&rl.label==='Sem oportunidade. Manter Relacionamento')rl.label='Sem oportunidade agora.Manter Relacionamento';return d;}}}catch(e){}return{deals:SEED_DEALS.map(d=>Object.assign({updates:[],tasks:[],contracts:[]},d)),stages:DEFAULT_STAGES.map(s=>({...s})),persistOK:true};}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){state.persistOK=false;}}
function esc(s){return(s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function initials(n){n=(n||'').trim();if(!n)return'?';const p=n.split(/\s+/);return(p[0][0]+(p[1]?p[1][0]:'')).toUpperCase();}
function colorFor(n){let h=0;for(const c of(n||''))h=(h*31+c.charCodeAt(0))>>>0;return AVC[h%AVC.length];}
function avatar(n){if(!n)return'<span class="dash">—</span>';return`<span class="av"><span class="ball" style="background:${colorFor(n)}">${esc(initials(n))}</span>${esc(n)}</span>`;}
function fmtNum(n){return(n||0).toLocaleString('pt-BR');}
function fmtSize(b){if(!b)return'';if(b<1024)return b+' B';if(b<1048576)return Math.round(b/1024)+' KB';return (b/1048576).toFixed(1)+' MB';}
function today(){return new Date().toISOString().slice(0,10);}
function fmtDue(d){if(!d)return'';const t=today();if(d===t)return'Hoje';const dt=new Date(d+'T00:00:00'),tt=new Date(t+'T00:00:00');const diff=Math.round((dt-tt)/864e5);if(diff===1)return'Amanhã';if(diff===-1)return'Ontem';return dt.toLocaleDateString('pt-BR',{day:'2-digit',month:'short'});}
function fmtDate(d){if(!d)return'';return new Date(d+'T00:00:00').toLocaleDateString('pt-BR');}
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),1800);}
function matchQ(d,q){if(!q)return true;q=q.toLowerCase();return[d.grupo,d.operadora,d.corretora,d.consultora,d.origem,d.frente].some(x=>(x||'').toLowerCase().includes(q));}
function allTasks(){const out=[];state.deals.forEach(d=>(d.tasks||[]).forEach(t=>out.push(Object.assign({dealId:d.id,dealName:d.grupo},t))));return out;}
function nextTask(d){const op=(d.tasks||[]).filter(t=>!t.done&&t.due).sort((a,b)=>a.due<b.due?-1:1);return op[0]||null;}

/* nav */
function setNav(n){nav=n;document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.nav===n));
  const titles={inicio:'Início',clientes:'Clientes'};$('pageTitle').textContent=titles[n];
  ['Inicio','Clientes'].forEach(v=>$('view'+v).style.display=(v.toLowerCase()===n)?'':'none');renderAll();}
document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>setNav(b.dataset.nav));

/* INICIO */
function splitOps(s){return (s||'').split(/,|\/|\se\s/i).map(x=>x.trim()).filter(Boolean);}
function rank(getter){
  const m={};
  state.deals.forEach(d=>{getter(d).forEach(name=>{if(!m[name])m[name]={n:0,vidas:0};m[name].n++;m[name].vidas+=(d.vidas||0);});});
  return Object.entries(m).map(([name,v])=>({name,...v})).sort((a,b)=>b.n-a.n);
}
function renderInicio(){
  const d=state.deals,vidas=d.reduce((s,x)=>s+(x.vidas||0),0);
  const fechados=d.filter(x=>x.etapa==='fechado').length;
  const fechVidas=d.filter(x=>x.etapa==='fechado').reduce((s,x)=>s+(x.vidas||0),0);
  const semCons=d.filter(x=>!((x.consultora||'').trim())).length;
  const counts={};state.stages.forEach(s=>counts[s.k]=0);d.forEach(x=>counts[x.etapa]++);
  const sums={};state.stages.forEach(s=>sums[s.k]=0);d.forEach(x=>sums[x.etapa]+=(x.vidas||0));

  let h=`<div class="kpis">
    <div class="kpi"><div class="lbl">Clientes ativos</div><div class="num">${d.length}</div><div class="sub">total do Excel</div></div>
    <div class="kpi"><div class="lbl">Vidas no pipeline</div><div class="num">${fmtNum(vidas)}</div><div class="sub">soma de todas as vidas</div></div>
    <div class="kpi green"><div class="lbl">Fechados</div><div class="num">${fechados}</div><div class="sub">${fmtNum(fechVidas)} vidas</div></div>
    <div class="kpi amber"><div class="lbl">Sem consultora</div><div class="num">${semCons}</div><div class="sub">não alocados</div></div>
  </div>`;

  // resumo: operadoras (cada operadora aparece) + consultoras (1 por cliente)
  const CATCH=['Sem operadora','Sem consultora'];
  const opMap={};let comOp=0,semOp=0,semOpV=0;
  d.forEach(x=>{const o=splitOps(x.operadora);if(o.length===0){semOp++;semOpV+=(x.vidas||0);return;}comOp++;o.forEach(nm=>{if(!opMap[nm])opMap[nm]={n:0,vidas:0};opMap[nm].n++;opMap[nm].vidas+=(x.vidas||0);});});
  let ops=Object.entries(opMap).map(([name,v])=>({name,...v})).sort((a,b)=>b.n-a.n);
  ops.push({name:'Sem operadora',n:semOp,vidas:semOpV});
  function rankBy(bucketFn,catchalls){const m={};d.forEach(x=>{const k=bucketFn(x);if(!m[k])m[k]={n:0,vidas:0};m[k].n++;m[k].vidas+=(x.vidas||0);});let arr=Object.entries(m).map(([name,v])=>({name,...v}));const cat=arr.filter(x=>catchalls.includes(x.name)).sort((a,b)=>catchalls.indexOf(a.name)-catchalls.indexOf(b.name));const reg=arr.filter(x=>!catchalls.includes(x.name)).sort((a,b)=>b.n-a.n);return reg.concat(cat);}
  const cons=rankBy(x=>(x.consultora||'').trim()||'Sem consultora',['Sem consultora']);
  const maxOp=Math.max(1,...ops.map(o=>o.n)),maxC=Math.max(1,...cons.map(c=>c.n));
  const bar=(items,max,color,footer)=>(items.length?items.map(i=>{const cat=CATCH.includes(i.name);return`
    <div class="rk"><div class="rk-top"><span class="rk-name"${cat?' style="color:var(--amber);font-style:italic"':''}>${esc(i.name)}</span><span class="rk-val">${i.n} <small>· ${fmtNum(i.vidas)} vidas</small></span></div><div class="rk-bar"><span style="width:${Math.round(i.n/max*100)}%;background:${cat?'#CDA24E':color}"></span></div></div>`;}).join(''):'<div style="color:var(--muted);font-size:13px;padding:6px 0">Sem dados ainda.</div>')+(footer||'');
  const opFooter=`<div class="rk-total">${comOp} com operadora · ${semOp} sem · <b>${d.length} clientes</b><div style="font-weight:400;color:var(--muted);font-size:11.5px;margin-top:4px">Cliente com mais de uma operadora aparece em cada uma.</div></div>`;
  const consFooter=`<div class="rk-total">Total: <b>${cons.reduce((a,b)=>a+b.n,0)} clientes</b></div>`;
  h+=`<div class="resumo2">
    <div class="panel"><div class="panel-h"><h2>Operadoras no pipeline</h2><span class="lnk" style="cursor:default">cada operadora</span></div><div class="rklist">${bar(ops,maxOp,'#F7941D',opFooter)}</div></div>
    <div class="panel"><div class="panel-h"><h2>Por consultora</h2><span class="lnk" style="cursor:default">por cliente</span></div><div class="rklist">${bar(cons,maxC,'#42B07C',consFooter)}</div></div>
  </div>`;

  // clientes por etapa (todas as etapas do Excel, auditável, soma 75)
  const maxN=Math.max(1,...state.stages.map(s=>counts[s.k]||0));
  h+=`<div class="panel"><div class="panel-h"><h2>Clientes por etapa <span style="font-weight:500;color:var(--muted);font-size:13px">— exatamente como no Excel</span></h2><button class="lnk" id="goClientes">ver tabela →</button></div><div class="rklist">`;
  state.stages.forEach(s=>{ h+=`<div class="rk"><div class="rk-top"><span class="rk-name"><span class="gdotin" style="background:${s.color}"></span>${esc(s.label)}</span><span class="rk-val">${counts[s.k]||0} <small>· ${fmtNum(sums[s.k]||0)} vidas</small></span></div><div class="rk-bar"><span style="width:${Math.round((counts[s.k]||0)/maxN*100)}%;background:${s.color}"></span></div></div>`; });
  h+=`<div class="rk-total">Total: <b>${d.length} clientes</b> · <b>${fmtNum(vidas)} vidas</b></div>`;
  h+=`</div></div>`;

  $('viewInicio').innerHTML=h;
  $('goClientes')&&($('goClientes').onclick=()=>setNav('clientes'));
}

/* CLIENTES — tabela agrupada estilo Monday */
let cliBy='etapa', cliCol={}, addingTo=null, editStage=null, editStageColor=null;
function slugK(s){return (s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'_').replace(/^_+|_+$/g,'')||'etapa';}
function addStage(label,color){let base=slugK(label),k=base,i=2;while(state.stages.some(s=>s.k===k))k=base+'_'+(i++);state.stages.push({k,label,color:color||STAGE_COLORS[state.stages.length%STAGE_COLORS.length]});save();}
function renameStage(k,label){const s=state.stages.find(x=>x.k===k);if(s){s.label=label;save();}}
function setStageColor(k,color){const s=state.stages.find(x=>x.k===k);if(s){s.color=color;save();}}
function deleteStage(k){if(state.stages.length<=1)return;const idx=state.stages.findIndex(s=>s.k===k);if(idx<0)return;const fb=(state.stages.find(s=>s.k!==k)||{}).k;state.deals.forEach(d=>{if(d.etapa===k)d.etapa=fb;});state.stages.splice(idx,1);save();}
function addClientToGroup(name){
  const key=addingTo.slice(addingTo.indexOf(':')+1);
  const obj={id:nextId(state.deals),grupo:name,etapa:(state.stages[0]||{}).k,vidas:0,operadora:'',corretora:'',origem:'',consultora:'',frente:'',obs:'',updates:[],tasks:[],contracts:[]};
  if(cliBy==='etapa')obj.etapa=key;else if(key!=='__none')obj.consultora=key;
  state.deals.push(obj);save();toast('Cliente adicionado');
}
function renderClientes(){
  const q=$('search').value.trim();
  let groups;
  if(cliBy==='etapa'){
    groups=state.stages.map(s=>({key:s.k,label:s.label,color:s.color,items:state.deals.filter(d=>d.etapa===s.k&&matchQ(d,q))}));
  } else {
    const m={};state.deals.forEach(d=>{if(!matchQ(d,q))return;const c=(d.consultora||'').trim()||'__none';(m[c]=m[c]||[]).push(d);});
    const ord=Object.keys(m).filter(k=>k!=='__none').sort((a,b)=>m[b].length-m[a].length);
    groups=ord.map(c=>({key:c,label:c,color:colorFor(c),items:m[c]}));
    if(m['__none'])groups.push({key:'__none',label:'Não alocado',color:'#B0AEB8',items:m['__none']});
  }
  groups=groups.filter(g=>g.items.length);
  const canEdit=cliBy==='etapa';
  const colh=`<div class="mh"><div>Cliente</div><div>Origem</div><div>Corretora atual</div><div>Operadora atual</div><div style="text-align:right">Vidas</div><div>À frente</div><div>Consultora</div></div>`;
  const tot=state.deals.filter(d=>matchQ(d,q));
  const totV=tot.reduce((a,d)=>a+(d.vidas||0),0);
  let h=`<div class="cli-bar">
      <div class="cli-left"><span class="cli-lbl">Agrupar por:</span>
        <button class="gbt ${cliBy==='etapa'?'on':''}" data-by="etapa">Etapa</button>
        <button class="gbt ${cliBy==='consultora'?'on':''}" data-by="consultora">Consultora</button></div>
      <div class="cli-right"><span class="cli-total"><b>${tot.length}</b> clientes · <b>${fmtNum(totV)}</b> vidas</span><button class="btn primary sm" id="addCliTop">+ Adicionar cliente</button></div>
    </div>
    <div class="mtbl">`;
  if(!groups.length && !canEdit) h+=`<div class="empty">Nenhum cliente encontrado.</div>`;
  groups.forEach(g=>{
    const sum=g.items.reduce((a,d)=>a+(d.vidas||0),0);
    const gid=cliBy+':'+g.key;
    const isC=cliCol[gid];
    h+=`<div class="mgrp" style="--gc:${g.color}"><div class="mgrp-h ${isC?'collapsed':''}" data-gk="${g.key}"><span class="arw">▾</span><span class="gname">${esc(g.label)}</span><span class="gcount">${g.items.length} ${g.items.length===1?'cliente':'clientes'}</span><span class="gs">${fmtNum(sum)} vidas</span>${canEdit?`<button class="gedit" data-gedit="${g.key}" title="Renomear, cor ou excluir">✎ editar</button>`:''}</div>`;
    if(canEdit && editStage===g.key){
      h+=`<div class="stage-edit"><input class="se-name" id="seName" value="${esc(g.label)}"><div class="se-colors">${STAGE_COLORS.map(c=>`<span class="se-sw ${c===editStageColor?'on':''}" data-secolor="${c}" style="background:${c}"></span>`).join('')}</div><div class="se-actions"><button class="btn primary sm" id="seSave">Salvar</button><button class="btn sm" id="seCancel">Cancelar</button><button class="btn sm" id="seDel" style="color:var(--red);border-color:#F0C9CC;margin-left:auto">Excluir etapa</button></div></div>`;
    }
    if(!isC){
      h+=colh;
      g.items.slice().sort((a,b)=>(b.vidas||0)-(a.vidas||0)).forEach(d=>{
        h+=`<div class="mrow" data-id="${d.id}">
          <div class="mc cn" style="border-left:3px solid ${g.color}">${esc(d.grupo)||'(sem nome)'}</div>
          <div class="mc dim">${esc(d.origem)||'<span class=dash>—</span>'}</div>
          <div class="mc dim">${esc(d.corretora)||'<span class=dash>—</span>'}</div>
          <div class="mc dim">${esc(d.operadora)||'<span class=dash>—</span>'}</div>
          <div class="mc num-c">${d.vidas?fmtNum(d.vidas):'<span class=dash>—</span>'}</div>
          <div class="mc">${avatar(d.frente)}</div>
          <div class="mc">${d.consultora?avatar(d.consultora):'<span class="naoaloc">Não alocado</span>'}</div>
        </div>`;
      });
      if(addingTo===gid){
        h+=`<div class="add-input-row"><input class="add-input" id="addInput" placeholder="Nome do cliente — Enter para adicionar" autocomplete="off"><button class="btn primary sm" id="addInputBtn">Adicionar</button><button class="btn sm" id="addInputCancel">Cancelar</button></div>`;
      } else {
        h+=`<div class="add-row" data-add="${g.key}"><span class="plus">+</span> Adicionar cliente${cliBy==='etapa'?' em '+esc(g.label):''}</div>`;
      }
    }
    h+=`</div>`;
  });
  if(canEdit){
    if(editStage==='__new'){
      h+=`<div class="stage-edit new"><input class="se-name" id="seName" placeholder="Nome da nova etapa (ex: Implantação)" autocomplete="off"><div class="se-colors">${STAGE_COLORS.map(c=>`<span class="se-sw ${c===editStageColor?'on':''}" data-secolor="${c}" style="background:${c}"></span>`).join('')}</div><div class="se-actions"><button class="btn primary sm" id="seAdd">Criar etapa</button><button class="btn sm" id="seCancel">Cancelar</button></div></div>`;
    } else {
      h+=`<div class="add-row stage-add" data-newstage="1"><span class="plus">+</span> Nova etapa</div>`;
    }
  }
  h+=`</div>`;
  $('viewClientes').innerHTML=h;
  $('addCliTop').onclick=()=>openDealModal();
  document.querySelectorAll('#viewClientes .gbt').forEach(b=>b.onclick=()=>{cliBy=b.dataset.by;addingTo=null;editStage=null;renderClientes();});
  document.querySelectorAll('#viewClientes .mgrp-h').forEach(x=>x.onclick=()=>{cliCol[cliBy+':'+x.dataset.gk]=!cliCol[cliBy+':'+x.dataset.gk];renderClientes();});
  document.querySelectorAll('#viewClientes .mrow').forEach(r=>r.onclick=()=>openDeal(+r.dataset.id));
  document.querySelectorAll('#viewClientes .add-row[data-add]').forEach(a=>a.onclick=()=>{if(cliBy==='etapa')openDealModal({etapa:a.dataset.add});else openDealModal({consultora:a.dataset.add==='__none'?'':a.dataset.add});});
  if(addingTo){
    const inp=$('addInput');
    const doAdd=()=>{const name=(inp.value||'').trim();if(!name){addingTo=null;renderClientes();return;}addClientToGroup(name);renderClientes();};
    if(inp){inp.focus();inp.onkeydown=e=>{if(e.key==='Enter')doAdd();else if(e.key==='Escape'){addingTo=null;renderClientes();}};}
    $('addInputBtn')&&($('addInputBtn').onclick=doAdd);
    $('addInputCancel')&&($('addInputCancel').onclick=()=>{addingTo=null;renderClientes();});
  }
  // edição de etapas
  document.querySelectorAll('#viewClientes .gedit').forEach(b=>b.onclick=e=>{e.stopPropagation();editStage=b.dataset.gedit;editStageColor=stOf(b.dataset.gedit).color;renderClientes();});
  document.querySelectorAll('#viewClientes [data-newstage]').forEach(b=>b.onclick=()=>{editStage='__new';editStageColor=STAGE_COLORS[0];renderClientes();});
  if(editStage){
    document.querySelectorAll('#viewClientes .se-sw').forEach(sw=>sw.onclick=()=>{editStageColor=sw.dataset.secolor;document.querySelectorAll('#viewClientes .se-sw').forEach(x=>x.classList.toggle('on',x===sw));});
    $('seCancel')&&($('seCancel').onclick=()=>{editStage=null;renderClientes();});
    const sn=$('seName');if(sn)sn.focus();
    if(editStage==='__new'){
      $('seAdd')&&($('seAdd').onclick=()=>{const nm=($('seName').value||'').trim();if(!nm){toast('Dê um nome à etapa');return;}addStage(nm,editStageColor);editStage=null;renderClientes();toast('Etapa criada');});
    } else {
      $('seSave')&&($('seSave').onclick=()=>{const nm=($('seName').value||'').trim();if(!nm){toast('Nome vazio');return;}renameStage(editStage,nm);setStageColor(editStage,editStageColor);editStage=null;renderClientes();toast('Etapa atualizada');});
      $('seDel')&&($('seDel').onclick=()=>{if(confirm('Excluir esta etapa? Os clientes dela serão movidos para outra etapa.')){deleteStage(editStage);editStage=null;renderClientes();toast('Etapa excluída');}});
    }
  }
}

/* TAREFAS */
function taskRow(t,showClient){const ty=TT[t.type]||TT.followup;const over=t.due&&!t.done&&t.due<today();
  return`<div class="trow" data-tid="${t.ts}" data-did="${t.dealId}">
    <div class="tcheck ${t.done?'done':''}" data-toggle>${t.done?'✓':''}</div>
    <div style="flex:1">
      <div class="ttitle ${t.done?'done':''}">${esc(t.title)}</div>
      <div class="tmeta"><span class="ttype" style="background:${ty.color}">${ty.label}</span>${showClient?`<span class="tclient" data-open="${t.dealId}">${esc(t.dealName)}</span>`:''}</div>
    </div>
    <span class="tdue ${over?'over':''}">${t.due?fmtDue(t.due):''}</span>
    <button class="tdel" data-del title="Excluir">✕</button>
  </div>`;}
function wireTaskRows(scope){
  scope.querySelectorAll('[data-toggle]').forEach(c=>c.onclick=e=>{e.stopPropagation();const row=c.closest('[data-tid]');toggleTask(+row.dataset.did,+row.dataset.tid);});
  scope.querySelectorAll('[data-del]').forEach(b=>b.onclick=e=>{e.stopPropagation();const row=b.closest('[data-tid]');delTask(+row.dataset.did,+row.dataset.tid);});
  scope.querySelectorAll('[data-open]').forEach(b=>b.onclick=e=>{e.stopPropagation();openDeal(+b.dataset.open);});
}
function renderTarefas(){
  const q=$('search').value.trim().toLowerCase();
  let tks=allTasks();if(q)tks=tks.filter(t=>t.title.toLowerCase().includes(q)||(t.dealName||'').toLowerCase().includes(q));
  const t=today();
  const groups=[
    {key:'over',label:'Atrasadas',cls:'over',f:x=>!x.done&&x.due&&x.due<t},
    {key:'today',label:'Hoje',f:x=>!x.done&&x.due===t},
    {key:'week',label:'Próximos 7 dias',f:x=>{if(x.done||!x.due||x.due<=t)return false;const diff=(new Date(x.due)-new Date(t))/864e5;return diff<=7;}},
    {key:'later',label:'Depois',f:x=>{if(x.done)return false;if(!x.due)return true;const diff=(new Date(x.due)-new Date(t))/864e5;return diff>7;}},
    {key:'done',label:'Concluídas',f:x=>x.done},
  ];
  let h='';
  groups.forEach(g=>{const items=tks.filter(g.f).sort((a,b)=>(a.due||'9')<(b.due||'9')?-1:1);if(!items.length)return;
    h+=`<div class="panel tgroup"><div class="gh ${g.cls||''}">${g.label}<span class="c">${items.length}</span></div>${items.map(x=>taskRow(x,true)).join('')}</div>`;});
  if(!h)h=`<div class="panel"><div class="empty">Nenhuma tarefa ainda.<br>Crie tarefas dentro de um cliente ou no botão Adicionar.<br><br><button class="btn primary sm" id="newTaskEmpty2">+ Nova tarefa</button></div></div>`;
  $('viewTarefas').innerHTML=h;
  $('newTaskEmpty2')&&($('newTaskEmpty2').onclick=()=>openTaskModal());
  wireTaskRows($('viewTarefas'));
  // badge
  const od=allTasks().filter(x=>!x.done&&x.due&&x.due<=t).length;const bd=$('navTaskBadge');if(od){bd.style.display='';bd.textContent=od;}else bd.style.display='none';
}

/* CONTRATOS */
/* task ops */
function toggleTask(did,ts){const d=state.deals.find(x=>x.id===did);if(!d)return;const t=d.tasks.find(x=>x.ts===ts);if(t){t.done=!t.done;save();renderAll();if(openId===did)renderDeal();}}
function delTask(did,ts){const d=state.deals.find(x=>x.id===did);if(!d)return;d.tasks=d.tasks.filter(x=>x.ts!==ts);save();renderAll();if(openId===did)renderDeal();}

/* DEAL drawer with tabs */
let openId=null,drTab='geral',ctrEditTs=null;
function openDeal(id,tab){openId=id;drTab=tab||'geral';ctrEditTs=null;renderDeal();$('scrim').classList.add('open');$('drawer').classList.add('open');}
function renderDeal(){
  const d=state.deals.find(x=>x.id===openId);if(!d)return;const s=stOf(d.etapa);
  const tkCount=(d.tasks||[]).filter(t=>!t.done).length;
  const ctrCount=(d.contracts||[]).length;
  let body='';
  if(drTab==='geral'){
    body=`<div class="block"><h4>Etapa</h4><div class="stagebtns">${state.stages.map(x=>`<button data-s="${x.k}" class="${d.etapa===x.k?'on':''}" style="${d.etapa===x.k?'background:'+x.color:''}">${x.label}</button>`).join('')}</div></div>
    <div class="block"><h4>Dados do cliente</h4>
      <div class="field"><label>Cliente / grupo</label><input id="f_grupo" value="${esc(d.grupo)}"></div>
      <div class="field"><label>Vidas</label><input id="f_vidas" type="number" value="${d.vidas||0}"></div>
      <div class="row2"><div class="field"><label>Operadora</label><input id="f_operadora" value="${esc(d.operadora)}"></div><div class="field"><label>Corretora</label><input id="f_corretora" value="${esc(d.corretora)}"></div></div>
      <div class="row2"><div class="field"><label>Origem</label><input id="f_origem" value="${esc(d.origem)}"></div><div class="field"><label>Consultora</label><input id="f_consultora" value="${esc(d.consultora)}"></div></div>
      <div class="field"><label>Quem está à frente</label><input id="f_frente" value="${esc(d.frente)}"></div>
      <div class="field"><label>Observações</label><textarea id="f_obs">${esc(d.obs)}</textarea></div>
    </div>
    <div class="block"><button class="btn" id="delDeal" style="color:var(--red);border-color:#F0C9CC;width:100%">Excluir cliente</button></div>`;
  } else if(drTab==='tarefas'){
    const tks=(d.tasks||[]).slice().sort((a,b)=>(a.done-b.done));
    body=`<div class="block"><h4>Nova tarefa</h4>
      <div style="display:flex;gap:8px"><input id="nt_title" placeholder="ex: Ligar para o RH" style="flex:1;border:1px solid var(--border-2);border-radius:8px;padding:9px 11px;font-size:14px;outline:none"><button class="btn primary" id="nt_add">Adicionar</button></div>
      <p class="help" style="margin:9px 0 0">Pode adicionar quantas tarefas quiser — digite e dê Enter.</p>
    </div>
    <div class="block"><h4>Tarefas (${tks.length})</h4>
      <div class="tklist">${tks.length?tks.map(t=>`<div class="tkitem"><div class="tcheck ${t.done?'done':''}" data-tk="${t.ts}">${t.done?'✓':''}</div><div class="ti"><div class="tt ${t.done?'done':''}">${esc(t.title)}</div></div><button class="tdel" data-tkdel="${t.ts}">✕</button></div>`).join(''):'<div style="color:var(--muted);font-size:13px">Nenhuma tarefa ainda. Adicione acima.</div>'}</div>
    </div>`;
  } else if(drTab==='contrato'){
    const cts=(d.contracts||[]);
    body=`<div class="block"><h4>Anexar contrato</h4>
      <p class="help">Anexe o arquivo do contrato (PDF, imagem ou Word). Pode anexar mais de um.</p>
      <button class="btn primary" id="ct_pick" style="width:100%">+ Anexar contrato</button>
      <input type="file" id="ct_file" accept=".pdf,.doc,.docx,.png,.jpg,.jpeg" style="display:none">
    </div>
    <div class="block"><h4>Contratos anexados (${cts.length})</h4>
      <div class="tklist">${cts.length?cts.map(c=>`<div class="tkitem"><div class="ti"><div class="tt">${esc(c.name||c.operadora||'Contrato')}</div><div class="tm">${c.size?'<span>'+fmtSize(c.size)+'</span>':''}${c.ts?'<span>'+new Date(c.ts).toLocaleDateString('pt-BR')+'</span>':''}</div></div>${c.data?`<button data-ctopen="${c.ts}" style="border:0;background:none;color:var(--pri);font-size:12px;font-weight:600;cursor:pointer">abrir</button>`:''}<button class="tdel" data-ctdel="${c.ts}">✕</button></div>`).join(''):'<div style="color:var(--muted);font-size:13px">Nenhum contrato anexado ainda.</div>'}</div>
    </div>`;
  } else {
    const bubbles=d.updates&&d.updates.length?d.updates.slice().reverse().map(u=>`<div class="bubble">${esc(u.text).replace(/\n/g,'<br>')}<div class="meta"><span>${new Date(u.ts).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}</span><button class="del" data-del="${u.ts}">remover</button></div></div>`).join(''):'<div style="color:var(--muted);font-size:13px">Nenhuma observação ainda.</div>';
    body=`<div class="block"><h4>Nova observação</h4><div class="field"><textarea id="updText" placeholder="Reunião, combinado, próximo passo…"></textarea></div><button class="btn primary" id="updAdd" style="width:100%">Adicionar observação</button><div class="bubble-list">${bubbles}</div></div>`;
  }
  $('drawerContent').innerHTML=`
    <div class="dr-head">
      <button class="x" id="drClose">×</button>
      <h2>${esc(d.grupo)||'(sem nome)'}</h2>
      <div class="sub"><span class="stchip" style="background:${s.color}">${s.label}</span><span>${d.vidas?fmtNum(d.vidas)+' vidas':''}</span></div>
      <div class="dr-tabs">
        <button data-t="geral" class="${drTab==='geral'?'on':''}">Visão geral</button>
        <button data-t="tarefas" class="${drTab==='tarefas'?'on':''}">Tarefas${tkCount?`<span class="tb">${tkCount}</span>`:''}</button>
        <button data-t="contrato" class="${drTab==='contrato'?'on':''}">Contrato${ctrCount?`<span class="tb">${ctrCount}</span>`:''}</button>
        <button data-t="anotacoes" class="${drTab==='anotacoes'?'on':''}">Observação</button>
      </div>
    </div>
    <div class="dr-body">${body}</div>`;
  $('drClose').onclick=closeDrawer;
  document.querySelectorAll('.dr-tabs button').forEach(b=>b.onclick=()=>{drTab=b.dataset.t;ctrEditTs=null;renderDeal();});
  if(drTab==='geral'){
    document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{d.etapa=b.dataset.s;save();renderDeal();renderAll();toast('Etapa: '+stOf(d.etapa).label);});
    const bind=(f,k,num)=>{$(f).onchange=e=>{d[k]=num?(parseInt(e.target.value)||0):e.target.value;save();renderAll();};};
    bind('f_grupo','grupo');bind('f_vidas','vidas',true);bind('f_operadora','operadora');bind('f_corretora','corretora');bind('f_origem','origem');bind('f_consultora','consultora');bind('f_frente','frente');bind('f_obs','obs');
    $('delDeal').onclick=()=>{if(confirm('Excluir este cliente?')){state.deals=state.deals.filter(x=>x.id!==openId);save();closeDrawer();renderAll();toast('Cliente excluído');}};
  } else if(drTab==='tarefas'){
    const addTk=()=>{const t=$('nt_title').value.trim();if(!t){toast('Escreva a tarefa');return;}(d.tasks=d.tasks||[]).push({ts:Date.now(),title:t,done:false});save();renderDeal();toast('Tarefa adicionada');};
    $('nt_add').onclick=addTk;
    const nti=$('nt_title');if(nti){nti.focus();nti.onkeydown=e=>{if(e.key==='Enter')addTk();};}
    document.querySelectorAll('[data-tk]').forEach(c=>c.onclick=()=>toggleTask(openId,+c.dataset.tk));
    document.querySelectorAll('[data-tkdel]').forEach(b=>b.onclick=()=>delTask(openId,+b.dataset.tkdel));
  } else if(drTab==='contrato'){
    $('ct_pick').onclick=()=>$('ct_file').click();
    $('ct_file').onchange=e=>{const f=e.target.files[0];if(!f)return;if(f.size>4*1024*1024){toast('Arquivo muito grande (máx 4MB)');e.target.value='';return;}const r=new FileReader();r.onload=()=>{(d.contracts=d.contracts||[]).push({ts:Date.now(),name:f.name,size:f.size,type:f.type,data:r.result});save();renderDeal();toast('Contrato anexado');};r.readAsDataURL(f);};
    document.querySelectorAll('[data-ctopen]').forEach(b=>b.onclick=()=>{const c=d.contracts.find(x=>x.ts==b.dataset.ctopen);if(!c||!c.data)return;try{const arr=c.data.split(',');const mime=(arr[0].match(/:(.*?);/)||[])[1]||c.type||'application/octet-stream';const bin=atob(arr[1]);const u8=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u8[i]=bin.charCodeAt(i);const url=URL.createObjectURL(new Blob([u8],{type:mime}));window.open(url,'_blank');}catch(err){const a=document.createElement('a');a.href=c.data;a.download=c.name||'contrato';a.click();}});
    document.querySelectorAll('[data-ctdel]').forEach(b=>b.onclick=()=>{if(confirm('Remover este contrato?')){d.contracts=d.contracts.filter(x=>x.ts!=b.dataset.ctdel);save();renderDeal();toast('Contrato removido');}});
  } else {
    $('updAdd').onclick=()=>{const t=$('updText').value.trim();if(!t){toast('Escreva algo');return;}(d.updates=d.updates||[]).push({text:t,ts:Date.now()});save();renderDeal();toast('Anotação salva');};
    document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{d.updates=d.updates.filter(u=>u.ts!=b.dataset.del);save();renderDeal();});
  }
}
function closeDrawer(){openId=null;$('scrim').classList.remove('open');$('drawer').classList.remove('open');}
$('scrim').onclick=closeDrawer;

/* modais */
function nextId(a){return Math.max(0,...a.map(x=>x.id))+1;}
function openDealModal(opts){opts=opts||{};['d_grupo','d_vidas','d_operadora','d_origem','d_consultora','d_frente'].forEach(i=>$(i).value='');$('d_etapa').innerHTML=state.stages.map(s=>`<option value="${s.k}">${esc(s.label)}</option>`).join('');if(opts.etapa)$('d_etapa').value=opts.etapa;if(opts.consultora)$('d_consultora').value=opts.consultora;$('modalDeal').classList.add('open');$('d_grupo').focus();}
$('d_cancel').onclick=()=>$('modalDeal').classList.remove('open');
$('modalDeal').onclick=e=>{if(e.target===$('modalDeal'))$('modalDeal').classList.remove('open');};
$('d_save').onclick=()=>{const g=$('d_grupo').value.trim();if(!g){toast('Informe o nome do cliente');return;}state.deals.push({id:nextId(state.deals),grupo:g,etapa:$('d_etapa').value,vidas:parseInt($('d_vidas').value)||0,operadora:$('d_operadora').value.trim(),corretora:'',origem:$('d_origem').value.trim(),consultora:$('d_consultora').value.trim(),frente:$('d_frente').value.trim(),obs:'',updates:[],tasks:[],contracts:[]});save();$('modalDeal').classList.remove('open');renderAll();toast('Cliente adicionado');};

function openTaskModal(){$('t_deal').innerHTML=state.deals.slice().sort((a,b)=>(a.grupo||'').localeCompare(b.grupo||'')).map(d=>`<option value="${d.id}">${esc(d.grupo)}</option>`).join('');$('t_type').innerHTML=Object.entries(TT).map(([k,v])=>`<option value="${k}">${v.label}</option>`).join('');$('t_title').value='';$('t_due').value=today();$('modalTask').classList.add('open');$('t_title').focus();}
$('t_cancel').onclick=()=>$('modalTask').classList.remove('open');
$('modalTask').onclick=e=>{if(e.target===$('modalTask'))$('modalTask').classList.remove('open');};
$('t_save').onclick=()=>{const ti=$('t_title').value.trim();if(!ti){toast('Escreva a tarefa');return;}const d=state.deals.find(x=>x.id==$('t_deal').value);if(!d)return;d.tasks.push({ts:Date.now(),title:ti,type:$('t_type').value,due:$('t_due').value,done:false});save();$('modalTask').classList.remove('open');renderAll();toast('Tarefa criada');};

$('btnAdd').onclick=()=>openDealModal();

/* import/export */
function cleanCons(c){c=(c||'').toString().trim();if(['na','n/a'].includes(c.toLowerCase()))return'';if(c.toLowerCase()==='jessica')return'Jéssica';return c;}
function mapEtapaText(txt){const t=(txt||'').toString().trim();if(!t)return'naoalocado';const norm=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();const nt=norm(t);const byLabel=state.stages.find(s=>norm(s.label)===nt);if(byLabel)return byLabel.k;if(nt.startsWith('lead'))return'lead';if(nt.includes('identific'))return'identificando';if(nt.includes('estudo'))return'estudo';if(nt.includes('cota'))return'cotacao';if(nt==='ds')return'ds';if(nt.includes('proposta'))return'proposta';if(nt.includes('negocia'))return'negociacao';if(nt.includes('fechad'))return'fechado';if(nt.includes('relacionamento')||nt.includes('sem oportunidade'))return'relacionamento';if(nt.includes('frio'))return'frio';return'naoalocado';}
function exportExcel(){
  if(typeof XLSX==='undefined'){toast('Excel indisponível — verifique a internet');return;}
  const data=state.deals.map(d=>({'Grupo':d.grupo||'','Parceiro de Origem':d.origem||'','Corretora Atual':d.corretora||'','Operadora Atual':d.operadora||'','Vidas':d.vidas||0,'Etapa':(stOf(d.etapa)||{}).label||'','Quem está a frente?':d.frente||'','Consultora Alocada':d.consultora||''}));
  const ws=XLSX.utils.json_to_sheet(data);ws['!cols']=[{wch:26},{wch:18},{wch:16},{wch:20},{wch:9},{wch:24},{wch:24},{wch:16}];
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Clientes');
  XLSX.writeFile(wb,'wiz-crm-clientes-'+today()+'.xlsx');toast('Excel exportado');
}
function importExcel(file){
  if(typeof XLSX==='undefined'){toast('Excel indisponível — verifique a internet');return;}
  const r=new FileReader();
  r.onload=e=>{try{
    const wb=XLSX.read(e.target.result,{type:'array'});
    const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''});
    if(!rows.length){toast('Planilha vazia');return;}
    const keys=Object.keys(rows[0]);
    const find=arr=>keys.find(k=>arr.some(n=>k.toLowerCase().includes(n)));
    const cG=find(['grupo','cliente']),cO=find(['parceiro','origem']),cC=find(['corretora']),cOp=find(['operadora']),cV=find(['vidas']),cE=find(['etapa']),cF=find(['frente']),cCo=find(['consultora']);
    if(!cG){toast('Não achei a coluna do cliente/Grupo');return;}
    let added=0,upd=0;
    rows.forEach(row=>{const grupo=(row[cG]||'').toString().trim();if(!grupo)return;
      const ex=state.deals.find(d=>(d.grupo||'').trim().toLowerCase()===grupo.toLowerCase());
      const f={grupo:grupo,origem:cO?(row[cO]||'').toString().trim():'',corretora:cC?(row[cC]||'').toString().trim():'',operadora:cOp?(row[cOp]||'').toString().trim():'',vidas:cV?(parseInt((row[cV]||'0').toString().replace(/[^\d]/g,''))||0):0,etapa:cE?mapEtapaText(row[cE]):'naoalocado',frente:cF?(row[cF]||'').toString().trim():'',consultora:cCo?cleanCons(row[cCo]):''};
      if(ex){Object.assign(ex,f);upd++;}else{state.deals.push(Object.assign({id:nextId(state.deals),obs:'',updates:[],tasks:[],contracts:[]},f));added++;}
    });
    save();renderAll();toast(added+' adicionados · '+upd+' atualizados');
  }catch(err){console.error(err);toast('Erro ao ler o Excel');}};
  r.readAsArrayBuffer(file);
}
$('btnExportXls').onclick=exportExcel;
function resetBase(){if(!confirm('Recarregar a base com os 81 clientes do Excel?\n\nIsso substitui os clientes atuais (tarefas, contratos e observações dos clientes atuais serão perdidos). Faça um backup .json antes se precisar.'))return;state={deals:SEED_DEALS.map(d=>Object.assign({updates:[],tasks:[],contracts:[]},d)),stages:DEFAULT_STAGES.map(s=>({...s})),persistOK:true};save();nav='inicio';setNav('inicio');toast('Base recarregada — 81 clientes');}
$('btnReset').onclick=resetBase;
$('btnImportXls').onclick=()=>$('xlsInput').click();
$('xlsInput').onchange=e=>{const f=e.target.files[0];if(f)importExcel(f);e.target.value='';};
$('btnExport').onclick=()=>{const b=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='wiz-crm-ana-'+today()+'.json';a.click();toast('Backup exportado');};
$('btnImport').onclick=()=>$('fileInput').click();
$('fileInput').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(d&&d.deals){state=d;state.deals=state.deals.map(x=>Object.assign({updates:[],tasks:[],contracts:[]},x));save();renderAll();toast('Importado!');}else toast('Arquivo inválido');}catch(err){toast('Erro ao ler');}};r.readAsText(f);e.target.value='';};
$('search').addEventListener('input',renderAll);

function renderAll(){
  if(nav==='inicio')renderInicio();else renderClientes();}
renderAll();
if(!state.persistOK||(()=>{try{localStorage.setItem('_t','1');localStorage.removeItem('_t');return false;}catch(e){return true;}})()){setTimeout(()=>toast('Salvamento local indisponível aqui. Funciona publicado no GitHub Pages — use Exportar pra backup.'),700);}
</script>
