<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wiz Saúde — CRM</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #ffffff;
    --bg2: #f6f6f4;
    --bg3: #f0efec;
    --text: #1a1a1a;
    --text2: #6b6b68;
    --border: rgba(0,0,0,0.12);
    --border2: rgba(0,0,0,0.22);
    --radius-md: 8px;
    --radius-lg: 12px;
    --red: #E24B4A;
    --red-dark: #c43c3b;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1c1a;
      --bg2: #252523;
      --bg3: #2e2e2b;
      --text: #f0efec;
      --text2: #9a9a96;
      --border: rgba(255,255,255,0.12);
      --border2: rgba(255,255,255,0.22);
    }
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg3);
    color: var(--text);
    min-height: 100vh;
    padding: 1.5rem;
  }

  .card {
    background: var(--bg);
    border-radius: var(--radius-lg);
    border: 0.5px solid var(--border);
    max-width: 1100px;
    margin: 0 auto;
    overflow: hidden;
  }

  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 1.25rem 1.5rem;
    border-bottom: 0.5px solid var(--border);
  }

  .logo { display: flex; align-items: center; gap: 10px; }
  .logo-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--red); flex-shrink: 0; }
  .logo-name { font-size: 18px; font-weight: 600; letter-spacing: -0.3px; }
  .logo-sub { font-size: 12px; color: var(--text2); margin-top: 1px; }
  .last-update { font-size: 12px; color: var(--text2); }

  .stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    padding: 1rem 1.5rem;
    border-bottom: 0.5px solid var(--border);
  }

  .stat {
    background: var(--bg2);
    border-radius: var(--radius-md);
    padding: 0.75rem 1rem;
  }
  .stat-label { font-size: 12px; color: var(--text2); margin-bottom: 4px; }
  .stat-value { font-size: 24px; font-weight: 600; }
  .stat-value.accent { color: var(--red); }

  .toolbar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0.875rem 1.5rem;
    border-bottom: 0.5px solid var(--border);
    flex-wrap: wrap;
  }

  .search-wrap { position: relative; flex: 1; min-width: 160px; }
  .search-wrap input { width: 100%; padding-left: 32px; }
  .search-icon { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); font-size: 15px; color: var(--text2); pointer-events: none; }

  input, select, textarea {
    background: var(--bg);
    color: var(--text);
    border: 0.5px solid var(--border2);
    border-radius: var(--radius-md);
    padding: 8px 12px;
    font-size: 13px;
    font-family: inherit;
    outline: none;
    transition: border-color 0.15s;
  }
  input:focus, select:focus, textarea:focus { border-color: var(--red); box-shadow: 0 0 0 3px rgba(226,75,74,0.12); }

  .filter-select { min-width: 140px; }

  .btn-add {
    background: var(--red);
    color: #fff;
    border: none;
    border-radius: var(--radius-md);
    padding: 8px 14px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    white-space: nowrap;
    font-family: inherit;
    transition: background 0.15s;
  }
  .btn-add:hover { background: var(--red-dark); }

  .table-wrap { overflow-x: auto; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th {
    text-align: left;
    padding: 10px 14px;
    font-size: 11px;
    font-weight: 600;
    color: var(--text2);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    border-bottom: 0.5px solid var(--border);
    white-space: nowrap;
    background: var(--bg2);
  }
  td { padding: 11px 14px; border-bottom: 0.5px solid var(--border); vertical-align: middle; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: var(--bg2); }

  .empresa-name { font-weight: 500; }
  .feedback-cell { max-width: 280px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text2); font-size: 12px; }

  .badge {
    display: inline-flex;
    align-items: center;
    padding: 3px 9px;
    border-radius: 99px;
    font-size: 11px;
    font-weight: 600;
    white-space: nowrap;
  }
  .badge.pendente   { background: #FAEEDA; color: #854F0B; }
  .badge.negociando { background: #E6F1FB; color: #185FA5; }
  .badge.ativo      { background: #EAF3DE; color: #3B6D11; }
  .badge.convertido { background: #E1F5EE; color: #0F6E56; }
  .badge.perdido    { background: #FCEBEB; color: #A32D2D; }

  .btn-icon {
    background: none;
    border: 0.5px solid var(--border2);
    border-radius: var(--radius-md);
    padding: 5px 8px;
    cursor: pointer;
    font-size: 15px;
    color: var(--text2);
    margin-right: 4px;
    font-family: inherit;
    transition: background 0.1s;
  }
  .btn-icon:hover { background: var(--bg2); }

  .empty {
    text-align: center;
    padding: 3.5rem 1rem;
    color: var(--text2);
    font-size: 14px;
  }
  .empty i { font-size: 36px; display: block; margin-bottom: 10px; }

  /* Modal */
  .overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.4);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 200;
    padding: 1rem;
  }
  .overlay.open { display: flex; }

  .modal {
    background: var(--bg);
    border-radius: var(--radius-lg);
    border: 0.5px solid var(--border);
    padding: 1.5rem;
    width: 100%;
    max-width: 480px;
    max-height: 90vh;
    overflow-y: auto;
  }

  .modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 1.25rem;
  }
  .modal-title { font-size: 16px; font-weight: 600; }
  .modal-close {
    background: none; border: none; font-size: 20px; cursor: pointer;
    color: var(--text2); line-height: 1; padding: 2px 6px;
  }

  .field { margin-bottom: 1rem; }
  .field label {
    display: block; font-size: 11px; color: var(--text2);
    margin-bottom: 5px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.4px;
  }
  .field input, .field select, .field textarea { width: 100%; }
  .field textarea { height: 90px; resize: vertical; }

  .modal-footer {
    display: flex; justify-content: flex-end;
    gap: 8px; margin-top: 1.25rem;
  }
  .btn-cancel {
    background: none;
    border: 0.5px solid var(--border2);
    border-radius: var(--radius-md);
    padding: 8px 16px; font-size: 13px;
    cursor: pointer; color: var(--text); font-family: inherit;
  }
  .btn-save {
    background: var(--red); color: #fff; border: none;
    border-radius: var(--radius-md); padding: 8px 16px;
    font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit;
  }
  .btn-save:hover { background: var(--red-dark); }

  .error-msg { font-size: 11px; color: var(--red); margin-top: 4px; display: none; }

  @media (max-width: 600px) {
    body { padding: 0.75rem; }
    .stats { grid-template-columns: repeat(3,1fr); gap: 6px; }
    .stat-value { font-size: 20px; }
    .toolbar { flex-direction: column; align-items: stretch; }
    .search-wrap { width: 100%; }
    .filter-select { width: 100%; }
    .btn-add { width: 100%; justify-content: center; }
  }
</style>
</head>
<body>

<div class="card">
  <div class="header">
    <div class="logo">
      <div class="logo-dot"></div>
      <div>
        <div class="logo-name">Wiz Saúde</div>
        <div class="logo-sub">Gestão de Clientes</div>
      </div>
    </div>
    <span class="last-update" id="last-update"></span>
  </div>

  <div class="stats">
    <div class="stat">
      <div class="stat-label">Total de empresas</div>
      <div class="stat-value" id="stat-total">0</div>
    </div>
    <div class="stat">
      <div class="stat-label">Em negociação</div>
      <div class="stat-value" id="stat-neg">0</div>
    </div>
    <div class="stat">
      <div class="stat-label">Convertidos</div>
      <div class="stat-value accent" id="stat-conv">0</div>
    </div>
  </div>

  <div class="toolbar">
    <div class="search-wrap">
      <i class="ti ti-search search-icon"></i>
      <input type="text" id="search-input" placeholder="Buscar empresa ou feedback..." oninput="renderTable()">
    </div>
    <select class="filter-select" id="filter-status" onchange="renderTable()">
      <option value="">Todos os status</option>
      <option value="pendente">Pendente</option>
      <option value="negociando">Negociando</option>
      <option value="ativo">Ativo</option>
      <option value="convertido">Convertido</option>
      <option value="perdido">Perdido</option>
    </select>
    <button class="btn-add" onclick="openModal()">
      <i class="ti ti-plus"></i> Nova empresa
    </button>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th style="width:22%">Empresa</th>
          <th style="width:13%">Início do atend.</th>
          <th style="width:12%">Status</th>
          <th>Feedback / observações</th>
          <th style="width:100px">Ações</th>
        </tr>
      </thead>
      <tbody id="table-body"></tbody>
    </table>
    <div class="empty" id="empty-state" style="display:none">
      <i class="ti ti-building"></i>
      Nenhuma empresa encontrada.<br>Clique em "Nova empresa" para começar.
    </div>
  </div>
</div>

<!-- Modal -->
<div class="overlay" id="modal-overlay">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title" id="modal-title">Nova empresa</span>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="field">
      <label>Nome da empresa *</label>
      <input type="text" id="f-empresa" placeholder="Ex.: Construtora ABC Ltda">
      <div class="error-msg" id="err-empresa">Preencha o nome da empresa.</div>
    </div>
    <div class="field">
      <label>Data de início do atendimento *</label>
      <input type="date" id="f-data">
      <div class="error-msg" id="err-data">Selecione uma data.</div>
    </div>
    <div class="field">
      <label>Status</label>
      <select id="f-status">
        <option value="pendente">Pendente</option>
        <option value="negociando">Negociando</option>
        <option value="ativo">Ativo</option>
        <option value="convertido">Convertido</option>
        <option value="perdido">Perdido</option>
      </select>
    </div>
    <div class="field">
      <label>Feedback / observações</label>
      <textarea id="f-feedback" placeholder="Ex.: Interessado em plano PME, aguardando proposta. Contato: Ana Silva — (11) 91234-5678"></textarea>
    </div>
    <div class="modal-footer">
      <button class="btn-cancel" onclick="closeModal()">Cancelar</button>
      <button class="btn-save" onclick="saveEntry()">Salvar</button>
    </div>
  </div>
</div>

<script>
const STORAGE_KEY = 'wiz_crm_v1';
let records = [];

function load() {
  try { records = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); } catch(e) { records = []; }
}

function save() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(records)); } catch(e) {}
}

function fmtDate(d) {
  if (!d) return '—';
  const [y, m, day] = d.split('-');
  return `${day}/${m}/${y}`;
}

const STATUS_LABELS = { pendente:'Pendente', negociando:'Negociando', ativo:'Ativo', convertido:'Convertido', perdido:'Perdido' };

function badge(s) {
  return `<span class="badge ${s}">${STATUS_LABELS[s] || s}</span>`;
}

function updateStats() {
  document.getElementById('stat-total').textContent = records.length;
  document.getElementById('stat-neg').textContent = records.filter(r => r.status === 'negociando').length;
  document.getElementById('stat-conv').textContent = records.filter(r => r.status === 'convertido').length;
  const now = new Date();
  document.getElementById('last-update').textContent =
    `Atualizado ${now.toLocaleDateString('pt-BR')} às ${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}`;
}

function renderTable() {
  const q = document.getElementById('search-input').value.toLowerCase();
  const fs = document.getElementById('filter-status').value;
  const rows = records.filter(r => {
    const mq = r.empresa.toLowerCase().includes(q) || (r.feedback||'').toLowerCase().includes(q);
    const ms = !fs || r.status === fs;
    return mq && ms;
  });

  const tbody = document.getElementById('table-body');
  const empty = document.getElementById('empty-state');

  if (rows.length === 0) {
    tbody.innerHTML = '';
    empty.style.display = 'block';
  } else {
    empty.style.display = 'none';
    tbody.innerHTML = rows.map(r => `
      <tr>
        <td><span class="empresa-name">${escHtml(r.empresa)}</span></td>
        <td>${fmtDate(r.data)}</td>
        <td>${badge(r.status)}</td>
        <td><span class="feedback-cell" title="${escHtml(r.feedback||'')}">${escHtml(r.feedback||'—')}</span></td>
        <td>
          <button class="btn-icon" onclick="openModal('${r.id}')" title="Editar"><i class="ti ti-edit"></i></button>
          <button class="btn-icon" onclick="deleteEntry('${r.id}')" title="Remover"><i class="ti ti-trash"></i></button>
        </td>
      </tr>
    `).join('');
  }
  updateStats();
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

let editId = null;

function openModal(id) {
  editId = id || null;
  clearErrors();
  if (id) {
    const r = records.find(x => x.id === id);
    document.getElementById('modal-title').textContent = 'Editar empresa';
    document.getElementById('f-empresa').value = r.empresa;
    document.getElementById('f-data').value = r.data;
    document.getElementById('f-status').value = r.status;
    document.getElementById('f-feedback').value = r.feedback || '';
  } else {
    document.getElementById('modal-title').textContent = 'Nova empresa';
    document.getElementById('f-empresa').value = '';
    document.getElementById('f-data').value = new Date().toISOString().split('T')[0];
    document.getElementById('f-status').value = 'pendente';
    document.getElementById('f-feedback').value = '';
  }
  document.getElementById('modal-overlay').classList.add('open');
  setTimeout(() => document.getElementById('f-empresa').focus(), 60);
}

function closeModal() {
  document.getElementById('modal-overlay').classList.remove('open');
  editId = null;
}

function clearErrors() {
  document.querySelectorAll('.error-msg').forEach(el => el.style.display = 'none');
}

function showError(id) {
  document.getElementById(id).style.display = 'block';
}

function saveEntry() {
  clearErrors();
  const empresa = document.getElementById('f-empresa').value.trim();
  const data    = document.getElementById('f-data').value;
  const status  = document.getElementById('f-status').value;
  const feedback = document.getElementById('f-feedback').value.trim();

  let valid = true;
  if (!empresa) { showError('err-empresa'); valid = false; }
  if (!data)    { showError('err-data');    valid = false; }
  if (!valid) return;

  if (editId) {
    const idx = records.findIndex(x => x.id === editId);
    records[idx] = { ...records[idx], empresa, data, status, feedback };
  } else {
    records.push({ id: Date.now().toString(36) + Math.random().toString(36).slice(2,6), empresa, data, status, feedback });
  }
  save();
  closeModal();
  renderTable();
}

function deleteEntry(id) {
  const r = records.find(x => x.id === id);
  if (!confirm(`Remover "${r.empresa}"?`)) return;
  records = records.filter(x => x.id !== id);
  save();
  renderTable();
}

document.getElementById('modal-overlay').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});

document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') closeModal();
});

load();
renderTable();
</script>
</body>
</html>
